name: Deploy versions to GitHub Pages

on:
  push:
    tags:
      - v2.0-redux-rtk-query
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout no-Redux version
        uses: actions/checkout@v4
        with:
          ref: v1.0-senza-redux
          path: sources/no-redux

      - name: Checkout Redux version
        uses: actions/checkout@v4
        with:
          ref: v2.0-redux-rtk-query
          path: sources/redux

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build no-Redux version
        working-directory: sources/no-redux/google-books-app
        run: |
          npm ci
          npx tsc -b
          npx vite build --base=/ESERCITAZIONE_COLLOQUIO/no-redux/
        env:
          VITE_GOOGLE_BOOKS_API_KEY: ${{ secrets.VITE_GOOGLE_BOOKS_API_KEY }}

      - name: Build Redux version
        working-directory: sources/redux/google-books-app
        run: |
          npm ci
          npx tsc -b
          npx vite build --base=/ESERCITAZIONE_COLLOQUIO/redux/
        env:
          VITE_GOOGLE_BOOKS_API_KEY: ${{ secrets.VITE_GOOGLE_BOOKS_API_KEY }}

      - name: Assemble Pages site
        run: |
          mkdir -p site/no-redux site/redux
          cp -R sources/no-redux/google-books-app/dist/. site/no-redux/
          cp -R sources/redux/google-books-app/dist/. site/redux/
          cp pages/index.html site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
